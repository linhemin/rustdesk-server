services:
  hbbs:
    image: ${RUSTDESK_SERVER_IMAGE:?Set RUSTDESK_SERVER_IMAGE to the image built from this fork}
    entrypoint: ["hbbs"]
    command: ["-k", "_", "-r", "${RELAY_SERVERS:?List the regional hbbr endpoints separated by commas}"]
    working_dir: /root
    volumes:
      - ./hbbs-data:/root
    ports:
      - "21115:21115/tcp"
      - "21116:21116/tcp"
      - "21116:21116/udp"
      - "127.0.0.1:21118:21118/tcp"
    restart: unless-stopped
